;----Backup encryption (master password): -----
;  Master-kodeord til den automatiske krypterede off-site backup.
;  Sendes ALDRIG i mailen og gemmes ALDRIG i databasen. Gem det et sikkert
;  sted (password manager/pengeskab) - mister du det, er backups tabt.
[backup_config]
BACKUP_PASSWORD=""	; Fill in:

;----Bank integration (PSD2 via Enable Banking) - optional: ------
;  See bank_integration.php for the steps. The private key file must lie OUTSIDE the web root.
[enablebanking_config]
EB_APPLICATION_ID=""	; Fill in: the application id from the Enable Banking Control Panel
EB_PRIVATE_KEY_PATH=""	; Fill in: full path to the downloaded private key (.pem)
EB_REDIRECT_URL=""	; Fill in: https://<your domain>/bank_integration_callback.php - registered exactly so at Enable Banking

;----phpLiteAdmin (inc/data/phpliteadmin.php) - optional: ------
;  Only for a logged-in TinyCash administrator, and only when a password of at least 12 characters is set here.
[admin_tools]
PHPLITEADMIN_PASSWORD=""	; Fill in: at least 12 characters - empty: phpLiteAdmin is closed

