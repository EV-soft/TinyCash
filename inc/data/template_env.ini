;----DB-selector: -----------------------------

; Database select Type: "mysql" or "sqlite"
; Uncomment one of following two lines to Aktivate:
;ACTIVE_DB="mysql_config"
ACTIVE_DB="sqlite_config"

; Time zone of dates and times (PHP name) - empty or missing: Europe/Copenhagen
TIMEZONE="Europe/Copenhagen"

[mysql_config]
DB_TYPE="mysql"
DB_HOST="localhost"
DB_USER=""	; Fill in:
DB_PASS=""	; Fill in:
DB_NAME=""	; Fill in:

[sqlite_config]
DB_TYPE="sqlite"
DB_PATH="data/tinycash.sqlite" ; Can calibrate

